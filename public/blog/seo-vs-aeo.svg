<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" role="img" aria-labelledby="t d" font-family="Outfit, 'Segoe UI', system-ui, sans-serif">
  <title id="t">Traditional SEO competes for a ranked link; AEO competes to be the cited source</title>
  <desc id="d">On the left, a classic search results page: ten ranked blue links, where the prize is a click and the competition is for position one. On the right, an AI generated answer that synthesises several sources and names two of them, where the prize is being cited inside the answer and the competition is to be quotable.</desc>

  <defs>
    <linearGradient id="bg3" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0A0E17"/>
      <stop offset="1" stop-color="#05070D"/>
    </linearGradient>
    <linearGradient id="accent3" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#00D2FF"/>
      <stop offset="0.5" stop-color="#378ADD"/>
      <stop offset="1" stop-color="#7B61FF"/>
    </linearGradient>
    <linearGradient id="aeoPanel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#378ADD" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#534AB7" stop-opacity="0.05"/>
    </linearGradient>
    <marker id="arrow3" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#00D2FF"/>
    </marker>
  </defs>

  <rect width="1200" height="630" fill="url(#bg3)"/>

  <text x="64" y="62" fill="#FFFFFF" font-size="32" font-weight="700">Two different games on the same query</text>
  <text x="64" y="92" fill="#94A3B8" font-size="15.5">“What is answer engine optimization?”</text>

  <!-- ===== LEFT: CLASSIC SERP ===== -->
  <rect x="64" y="122" width="500" height="420" rx="18" fill="#0E1524" stroke="#FFFFFF" stroke-opacity="0.08"/>

  <rect x="88" y="146" width="150" height="26" rx="13" fill="#64748B" fill-opacity="0.16"/>
  <text x="104" y="164" fill="#94A3B8" font-size="12.5" font-weight="700" letter-spacing="0.8">TRADITIONAL SEO</text>

  <text x="88" y="200" fill="#FFFFFF" font-size="18" font-weight="600">A page of ranked links</text>

  <!-- result rows -->
  <g>
    <rect x="88" y="218" width="452" height="44" rx="9" fill="#378ADD" fill-opacity="0.10" stroke="#378ADD" stroke-opacity="0.35"/>
    <text x="104" y="238" fill="#378ADD" font-size="12" font-weight="700">1</text>
    <rect x="120" y="228" width="240" height="8" rx="4" fill="#378ADD" fill-opacity="0.75"/>
    <rect x="120" y="243" width="330" height="6" rx="3" fill="#94A3B8" fill-opacity="0.35"/>
    <text x="470" y="245" fill="#00D2FF" font-size="12" font-weight="700">the prize</text>

    <rect x="88" y="270" width="452" height="38" rx="9" fill="#FFFFFF" fill-opacity="0.02"/>
    <text x="104" y="288" fill="#64748B" font-size="12" font-weight="700">2</text>
    <rect x="120" y="280" width="200" height="7" rx="3.5" fill="#94A3B8" fill-opacity="0.35"/>
    <rect x="120" y="293" width="300" height="5" rx="2.5" fill="#94A3B8" fill-opacity="0.18"/>

    <rect x="88" y="316" width="452" height="38" rx="9" fill="#FFFFFF" fill-opacity="0.02"/>
    <text x="104" y="334" fill="#64748B" font-size="12" font-weight="700">3</text>
    <rect x="120" y="326" width="220" height="7" rx="3.5" fill="#94A3B8" fill-opacity="0.28"/>
    <rect x="120" y="339" width="280" height="5" rx="2.5" fill="#94A3B8" fill-opacity="0.14"/>

    <rect x="88" y="362" width="452" height="38" rx="9" fill="#FFFFFF" fill-opacity="0.02"/>
    <text x="104" y="380" fill="#64748B" font-size="12" font-weight="700">4</text>
    <rect x="120" y="372" width="190" height="7" rx="3.5" fill="#94A3B8" fill-opacity="0.22"/>
    <rect x="120" y="385" width="260" height="5" rx="2.5" fill="#94A3B8" fill-opacity="0.11"/>

    <text x="120" y="420" fill="#64748B" font-size="13">…positions 5 to 10, rarely clicked</text>
  </g>

  <rect x="88" y="440" width="452" height="1" fill="#FFFFFF" fill-opacity="0.07"/>
  <text x="88" y="470" fill="#64748B" font-size="12.5" font-weight="700" letter-spacing="0.8">YOU WIN BY</text>
  <text x="88" y="492" fill="#FFFFFF" font-size="14.5">Out-ranking competitors for a position</text>
  <text x="88" y="516" fill="#64748B" font-size="12.5" font-weight="700" letter-spacing="0.8">REWARD</text>
  <text x="200" y="516" fill="#94A3B8" font-size="14">A click to your site</text>

  <!-- ===== RIGHT: AI ANSWER ===== -->
  <rect x="636" y="122" width="500" height="420" rx="18" fill="url(#aeoPanel)" stroke="#378ADD" stroke-opacity="0.45" stroke-width="1.5"/>

  <rect x="660" y="146" width="66" height="26" rx="13" fill="#00D2FF" fill-opacity="0.15"/>
  <text x="676" y="164" fill="#00D2FF" font-size="12.5" font-weight="700" letter-spacing="0.8">AEO</text>

  <text x="660" y="200" fill="#FFFFFF" font-size="18" font-weight="600">One synthesised answer</text>

  <!-- answer bubble -->
  <rect x="660" y="218" width="452" height="182" rx="14" fill="#0A0E17" stroke="#FFFFFF" stroke-opacity="0.09"/>
  <circle cx="684" cy="242" r="10" fill="#00D2FF" fill-opacity="0.18"/>
  <circle cx="681" cy="240" r="2" fill="#00D2FF"/>
  <circle cx="688" cy="240" r="2" fill="#00D2FF"/>
  <path d="M680 246h9" stroke="#00D2FF" stroke-width="1.5" stroke-linecap="round"/>
  <text x="704" y="247" fill="#94A3B8" font-size="12.5" font-weight="600">AI answer</text>

  <rect x="684" y="266" width="404" height="8" rx="4" fill="#FFFFFF" fill-opacity="0.30"/>
  <rect x="684" y="284" width="380" height="8" rx="4" fill="#FFFFFF" fill-opacity="0.24"/>
  <rect x="684" y="302" width="396" height="8" rx="4" fill="#FFFFFF" fill-opacity="0.24"/>
  <rect x="684" y="320" width="270" height="8" rx="4" fill="#FFFFFF" fill-opacity="0.18"/>

  <!-- citations -->
  <rect x="684" y="346" width="150" height="32" rx="8" fill="#00D2FF" fill-opacity="0.14" stroke="#00D2FF" stroke-opacity="0.55"/>
  <circle cx="702" cy="362" r="4" fill="#00D2FF"/>
  <text x="714" y="367" fill="#00D2FF" font-size="12.5" font-weight="700">yoursite.com</text>

  <rect x="844" y="346" width="132" height="32" rx="8" fill="#FFFFFF" fill-opacity="0.05" stroke="#FFFFFF" stroke-opacity="0.12"/>
  <circle cx="862" cy="362" r="4" fill="#64748B"/>
  <text x="874" y="367" fill="#94A3B8" font-size="12.5">competitor</text>

  <text x="996" y="367" fill="#64748B" font-size="12.5">+ 6 more</text>

  <!-- sources feeding in -->
  <path d="M700 414 C 700 406, 760 404, 780 400" stroke="#00D2FF" stroke-opacity="0.35" stroke-width="1.6" fill="none" marker-end="url(#arrow3)"/>
  <path d="M886 414 C 886 408, 870 404, 860 400" stroke="#00D2FF" stroke-opacity="0.35" stroke-width="1.6" fill="none" marker-end="url(#arrow3)"/>
  <path d="M1064 414 C 1064 406, 1000 404, 950 400" stroke="#00D2FF" stroke-opacity="0.2" stroke-width="1.6" fill="none" marker-end="url(#arrow3)"/>
  <rect x="660" y="414" width="80" height="20" rx="6" fill="#FFFFFF" fill-opacity="0.05"/>
  <rect x="846" y="414" width="80" height="20" rx="6" fill="#FFFFFF" fill-opacity="0.05"/>
  <rect x="1024" y="414" width="80" height="20" rx="6" fill="#FFFFFF" fill-opacity="0.05"/>
  <text x="886" y="450" fill="#64748B" font-size="12" text-anchor="middle">sources read, not ranked</text>

  <rect x="660" y="458" width="452" height="1" fill="#FFFFFF" fill-opacity="0.07"/>
  <text x="660" y="486" fill="#00D2FF" font-size="12.5" font-weight="700" letter-spacing="0.8">YOU WIN BY</text>
  <text x="660" y="508" fill="#FFFFFF" font-size="14.5">Being the clearest, most quotable source</text>
  <text x="660" y="530" fill="#64748B" font-size="12.5" font-weight="700" letter-spacing="0.8">REWARD</text>
  <text x="772" y="530" fill="#94A3B8" font-size="14">Named as the authority</text>

  <text x="64" y="588" fill="#64748B" font-size="13">aivonixflow.com · Where AI meets automation</text>
  <rect x="64" y="600" width="120" height="3" rx="1.5" fill="url(#accent3)"/>
</svg>
