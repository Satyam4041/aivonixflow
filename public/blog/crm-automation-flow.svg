<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" role="img" aria-labelledby="t d" font-family="Outfit, 'Segoe UI', system-ui, sans-serif">
  <title id="t">How AI automation moves a lead through a CRM</title>
  <desc id="d">A lead arrives from a web form, email or chat. An AI agent enriches it, scores it and routes it. A CRM record is created automatically, and the outcome is either an assigned owner, a nurture sequence, or a disqualification — with no manual data entry at any step.</desc>

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0A0E17"/>
      <stop offset="1" stop-color="#05070D"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#00D2FF"/>
      <stop offset="0.45" stop-color="#378ADD"/>
      <stop offset="0.8" stop-color="#534AB7"/>
      <stop offset="1" stop-color="#7B61FF"/>
    </linearGradient>
    <linearGradient id="agentFill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#378ADD" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#534AB7" stop-opacity="0.10"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#378ADD" stop-opacity="0.30"/>
      <stop offset="1" stop-color="#378ADD" stop-opacity="0"/>
    </radialGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#378ADD"/>
    </marker>
    <marker id="arrowDim" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#64748B"/>
    </marker>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>
  <ellipse cx="600" cy="300" rx="520" ry="260" fill="url(#glow)"/>

  <!-- header -->
  <rect x="64" y="48" width="196" height="30" rx="15" fill="#101726" stroke="#378ADD" stroke-opacity="0.35"/>
  <circle cx="84" cy="63" r="4" fill="#00D2FF"/>
  <text x="98" y="68" fill="#00D2FF" font-size="14" font-weight="600" letter-spacing="0.5">CRM AUTOMATION FLOW</text>

  <text x="64" y="122" fill="#FFFFFF" font-size="34" font-weight="700">From raw lead to CRM record — without a human touching it</text>

  <!-- STAGE 1: SOURCES -->
  <text x="64" y="186" fill="#64748B" font-size="13" font-weight="600" letter-spacing="1.2">1 · SOURCES</text>
  <g>
    <rect x="64" y="204" width="212" height="60" rx="14" fill="#0E1524" stroke="#FFFFFF" stroke-opacity="0.10"/>
    <rect x="82" y="224" width="22" height="22" rx="5" fill="#00D2FF" fill-opacity="0.15" stroke="#00D2FF" stroke-opacity="0.5"/>
    <path d="M87 231h12M87 236h12M87 241h7" stroke="#00D2FF" stroke-width="1.6" stroke-linecap="round"/>
    <text x="116" y="232" fill="#FFFFFF" font-size="15" font-weight="600">Website form</text>
    <text x="116" y="250" fill="#64748B" font-size="12.5">Name, email, message</text>

    <rect x="64" y="276" width="212" height="60" rx="14" fill="#0E1524" stroke="#FFFFFF" stroke-opacity="0.10"/>
    <rect x="82" y="296" width="22" height="22" rx="5" fill="#378ADD" fill-opacity="0.15" stroke="#378ADD" stroke-opacity="0.5"/>
    <path d="M86 301l11 8 11-8" stroke="#378ADD" stroke-width="1.6" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="116" y="304" fill="#FFFFFF" font-size="15" font-weight="600">Inbound email</text>
    <text x="116" y="322" fill="#64748B" font-size="12.5">Unstructured text</text>

    <rect x="64" y="348" width="212" height="60" rx="14" fill="#0E1524" stroke="#FFFFFF" stroke-opacity="0.10"/>
    <rect x="82" y="368" width="22" height="22" rx="5" fill="#7B61FF" fill-opacity="0.15" stroke="#7B61FF" stroke-opacity="0.5"/>
    <path d="M86 374h14v9h-6l-4 4v-4h-4z" stroke="#7B61FF" stroke-width="1.5" fill="none" stroke-linejoin="round"/>
    <text x="116" y="376" fill="#FFFFFF" font-size="15" font-weight="600">Chat / WhatsApp</text>
    <text x="116" y="394" fill="#64748B" font-size="12.5">Conversation log</text>
  </g>

  <!-- arrows to agent -->
  <path d="M284 234 C 330 234, 340 290, 376 300" stroke="#378ADD" stroke-opacity="0.55" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
  <path d="M284 306 C 326 306, 340 304, 376 306" stroke="#378ADD" stroke-opacity="0.55" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
  <path d="M284 378 C 330 378, 340 322, 376 312" stroke="#378ADD" stroke-opacity="0.55" stroke-width="2" fill="none" marker-end="url(#arrow)"/>

  <!-- STAGE 2: AI AGENT -->
  <text x="392" y="186" fill="#64748B" font-size="13" font-weight="600" letter-spacing="1.2">2 · AI AGENT</text>
  <rect x="392" y="204" width="268" height="204" rx="18" fill="url(#agentFill)" stroke="#378ADD" stroke-opacity="0.45" stroke-width="1.5"/>
  <rect x="412" y="222" width="30" height="30" rx="9" fill="#0A0E17" stroke="#00D2FF" stroke-opacity="0.6"/>
  <circle cx="421" cy="234" r="2.4" fill="#00D2FF"/>
  <circle cx="433" cy="234" r="2.4" fill="#00D2FF"/>
  <path d="M420 243h14" stroke="#00D2FF" stroke-width="1.8" stroke-linecap="round"/>
  <text x="452" y="235" fill="#FFFFFF" font-size="16" font-weight="700">Autonomous agent</text>
  <text x="452" y="252" fill="#94A3B8" font-size="12.5">Runs on every new lead</text>

  <g>
    <rect x="412" y="268" width="228" height="38" rx="10" fill="#0A0E17" stroke="#FFFFFF" stroke-opacity="0.08"/>
    <circle cx="431" cy="287" r="9" fill="#00D2FF" fill-opacity="0.15"/>
    <text x="428" y="291" fill="#00D2FF" font-size="11" font-weight="700">1</text>
    <text x="450" y="285" fill="#FFFFFF" font-size="13.5" font-weight="600">Extract &amp; structure</text>
    <text x="450" y="299" fill="#64748B" font-size="11.5">Free text into clean fields</text>

    <rect x="412" y="314" width="228" height="38" rx="10" fill="#0A0E17" stroke="#FFFFFF" stroke-opacity="0.08"/>
    <circle cx="431" cy="333" r="9" fill="#378ADD" fill-opacity="0.18"/>
    <text x="428" y="337" fill="#378ADD" font-size="11" font-weight="700">2</text>
    <text x="450" y="331" fill="#FFFFFF" font-size="13.5" font-weight="600">Enrich</text>
    <text x="450" y="345" fill="#64748B" font-size="11.5">Company size, industry, intent</text>

    <rect x="412" y="360" width="228" height="38" rx="10" fill="#0A0E17" stroke="#FFFFFF" stroke-opacity="0.08"/>
    <circle cx="431" cy="379" r="9" fill="#7B61FF" fill-opacity="0.18"/>
    <text x="428" y="383" fill="#7B61FF" font-size="11" font-weight="700">3</text>
    <text x="450" y="377" fill="#FFFFFF" font-size="13.5" font-weight="600">Score &amp; route</text>
    <text x="450" y="391" fill="#64748B" font-size="11.5">Rules you define, not a black box</text>
  </g>

  <path d="M668 306 L 726 306" stroke="#378ADD" stroke-opacity="0.6" stroke-width="2" fill="none" marker-end="url(#arrow)"/>

  <!-- STAGE 3: CRM -->
  <text x="742" y="186" fill="#64748B" font-size="13" font-weight="600" letter-spacing="1.2">3 · CRM RECORD</text>
  <rect x="742" y="204" width="200" height="204" rx="18" fill="#0E1524" stroke="#00D2FF" stroke-opacity="0.35" stroke-width="1.5"/>
  <ellipse cx="842" cy="240" rx="42" ry="13" fill="none" stroke="#00D2FF" stroke-opacity="0.55" stroke-width="1.6"/>
  <path d="M800 240v34c0 7 19 13 42 13s42-6 42-13v-34" fill="none" stroke="#00D2FF" stroke-opacity="0.55" stroke-width="1.6"/>
  <path d="M800 258c0 7 19 13 42 13s42-6 42-13" fill="none" stroke="#00D2FF" stroke-opacity="0.35" stroke-width="1.4"/>
  <text x="762" y="316" fill="#FFFFFF" font-size="14.5" font-weight="600">Created automatically</text>
  <g fill="#94A3B8" font-size="12.5">
    <text x="762" y="340">Contact + company</text>
    <text x="762" y="360">Source &amp; timestamp</text>
    <text x="762" y="380">Score and next action</text>
  </g>
  <path d="M762 348h100M762 368h100" stroke="#FFFFFF" stroke-opacity="0.06"/>

  <path d="M950 306 L 1008 306" stroke="#378ADD" stroke-opacity="0.6" stroke-width="2" fill="none" marker-end="url(#arrow)"/>

  <!-- STAGE 4: OUTCOMES -->
  <text x="1016" y="186" fill="#64748B" font-size="13" font-weight="600" letter-spacing="1.2">4 · OUTCOME</text>
  <rect x="1016" y="216" width="120" height="52" rx="12" fill="#0E1524" stroke="#00D2FF" stroke-opacity="0.4"/>
  <text x="1032" y="240" fill="#00D2FF" font-size="13.5" font-weight="700">Assigned</text>
  <text x="1032" y="257" fill="#64748B" font-size="11.5">to a rep instantly</text>

  <rect x="1016" y="280" width="120" height="52" rx="12" fill="#0E1524" stroke="#7B61FF" stroke-opacity="0.4"/>
  <text x="1032" y="304" fill="#7B61FF" font-size="13.5" font-weight="700">Nurtured</text>
  <text x="1032" y="321" fill="#64748B" font-size="11.5">sequence starts</text>

  <rect x="1016" y="344" width="120" height="52" rx="12" fill="#0E1524" stroke="#64748B" stroke-opacity="0.4"/>
  <text x="1032" y="368" fill="#94A3B8" font-size="13.5" font-weight="700">Disqualified</text>
  <text x="1032" y="385" fill="#64748B" font-size="11.5">with a reason</text>

  <!-- footer comparison bar -->
  <rect x="64" y="452" width="1072" height="1" fill="#FFFFFF" fill-opacity="0.08"/>

  <g>
    <text x="64" y="492" fill="#64748B" font-size="13" font-weight="600" letter-spacing="1.2">MANUAL PROCESS</text>
    <rect x="64" y="506" width="420" height="34" rx="8" fill="#64748B" fill-opacity="0.12"/>
    <text x="80" y="528" fill="#94A3B8" font-size="14">Copy → paste → assign → follow up</text>
    <text x="500" y="529" fill="#94A3B8" font-size="15" font-weight="700">hours to days</text>
  </g>

  <g>
    <text x="640" y="492" fill="#00D2FF" font-size="13" font-weight="600" letter-spacing="1.2">AUTOMATED</text>
    <rect x="640" y="506" width="360" height="34" rx="8" fill="url(#accent)" fill-opacity="0.22"/>
    <text x="656" y="528" fill="#FFFFFF" font-size="14">Same four steps, no operator</text>
    <text x="1016" y="529" fill="#00D2FF" font-size="15" font-weight="700">seconds</text>
  </g>

  <text x="64" y="586" fill="#64748B" font-size="13">aivonixflow.com · Where AI meets automation</text>
  <rect x="64" y="598" width="120" height="3" rx="1.5" fill="url(#accent)"/>
</svg>
