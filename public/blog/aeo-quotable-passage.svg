<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" width="1200" height="700" role="img" aria-labelledby="t d" font-family="Outfit, 'Segoe UI', system-ui, sans-serif">
  <title id="t">What makes a passage quotable by an answer engine</title>
  <desc id="d">Two versions of the same paragraph. The version that does not get cited opens with vague marketing language, uses pronouns that depend on earlier sentences, and gives no specifics. The version that does get cited restates the question, answers it in the first sentence, names concrete numbers and systems, and stands alone without surrounding context. Below, four technical requirements: crawler access, structured data, server-rendered HTML, and a stated publish date.</desc>

  <defs>
    <linearGradient id="bg4" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0A0E17"/>
      <stop offset="1" stop-color="#05070D"/>
    </linearGradient>
    <linearGradient id="accent4" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#00D2FF"/>
      <stop offset="0.5" stop-color="#378ADD"/>
      <stop offset="1" stop-color="#7B61FF"/>
    </linearGradient>
    <linearGradient id="good" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#378ADD" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#534AB7" stop-opacity="0.05"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="700" fill="url(#bg4)"/>

  <text x="64" y="62" fill="#FFFFFF" font-size="32" font-weight="700">Why one paragraph gets quoted and the other doesn’t</text>
  <text x="64" y="92" fill="#94A3B8" font-size="15.5">Same question. Same facts. Only one can be lifted out and still make sense.</text>

  <!-- ===== NOT CITED ===== -->
  <rect x="64" y="124" width="508" height="290" rx="16" fill="#0E1524" stroke="#FFFFFF" stroke-opacity="0.08"/>
  <rect x="88" y="148" width="118" height="26" rx="13" fill="#64748B" fill-opacity="0.16"/>
  <text x="104" y="166" fill="#94A3B8" font-size="12.5" font-weight="700" letter-spacing="0.8">NOT CITED</text>

  <text x="88" y="206" fill="#64748B" font-size="14" font-style="italic">“In today’s fast-moving digital landscape,</text>
  <text x="88" y="228" fill="#64748B" font-size="14" font-style="italic">businesses need to leverage cutting-edge</text>
  <text x="88" y="250" fill="#64748B" font-size="14" font-style="italic">solutions. That’s where it really helps.</text>
  <text x="88" y="272" fill="#64748B" font-size="14" font-style="italic">We offer the best service possible.”</text>

  <g>
    <circle cx="98" cy="308" r="7" fill="#64748B" fill-opacity="0.2"/>
    <path d="M95 305l6 6M101 305l-6 6" stroke="#94A3B8" stroke-width="1.6" stroke-linecap="round"/>
    <text x="116" y="313" fill="#94A3B8" font-size="13">Answer never actually stated</text>

    <circle cx="98" cy="336" r="7" fill="#64748B" fill-opacity="0.2"/>
    <path d="M95 333l6 6M101 333l-6 6" stroke="#94A3B8" stroke-width="1.6" stroke-linecap="round"/>
    <text x="116" y="341" fill="#94A3B8" font-size="13">“it”, “that” — depends on earlier text</text>

    <circle cx="98" cy="364" r="7" fill="#64748B" fill-opacity="0.2"/>
    <path d="M95 361l6 6M101 361l-6 6" stroke="#94A3B8" stroke-width="1.6" stroke-linecap="round"/>
    <text x="116" y="369" fill="#94A3B8" font-size="13">Zero numbers, names or specifics</text>
  </g>
  <text x="88" y="398" fill="#64748B" font-size="12.5">Lift this out of the page and it says nothing.</text>

  <!-- ===== CITED ===== -->
  <rect x="628" y="124" width="508" height="290" rx="16" fill="url(#good)" stroke="#378ADD" stroke-opacity="0.45" stroke-width="1.5"/>
  <rect x="652" y="148" width="86" height="26" rx="13" fill="#00D2FF" fill-opacity="0.15"/>
  <text x="668" y="166" fill="#00D2FF" font-size="12.5" font-weight="700" letter-spacing="0.8">CITED</text>

  <text x="652" y="206" fill="#FFFFFF" font-size="14" font-weight="600">“Answer Engine Optimization is the</text>
  <text x="652" y="228" fill="#FFFFFF" font-size="14" font-weight="600">practice of structuring content so AI</text>
  <text x="652" y="250" fill="#FFFFFF" font-size="14" font-weight="600">systems can quote it accurately. It relies</text>
  <text x="652" y="272" fill="#FFFFFF" font-size="14" font-weight="600">on question-led headings, self-contained</text>
  <text x="652" y="294" fill="#FFFFFF" font-size="14" font-weight="600">answers and machine-readable markup.”</text>

  <g>
    <circle cx="662" cy="330" r="7" fill="#00D2FF" fill-opacity="0.2"/>
    <path d="M659 330l2.5 2.5 4-5" stroke="#00D2FF" stroke-width="1.8" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="680" y="335" fill="#94A3B8" font-size="13">Term defined in the first sentence</text>

    <circle cx="662" cy="358" r="7" fill="#00D2FF" fill-opacity="0.2"/>
    <path d="M659 358l2.5 2.5 4-5" stroke="#00D2FF" stroke-width="1.8" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="680" y="363" fill="#94A3B8" font-size="13">No pronouns pointing outside the passage</text>

    <circle cx="662" cy="386" r="7" fill="#00D2FF" fill-opacity="0.2"/>
    <path d="M659 386l2.5 2.5 4-5" stroke="#00D2FF" stroke-width="1.8" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="680" y="391" fill="#94A3B8" font-size="13">Names the three things it depends on</text>
  </g>

  <!-- ===== TECHNICAL LAYER ===== -->
  <rect x="64" y="446" width="1072" height="1" fill="#FFFFFF" fill-opacity="0.08"/>
  <text x="64" y="486" fill="#FFFFFF" font-size="20" font-weight="700">Writing alone is not enough — the crawler has to reach it</text>

  <g>
    <rect x="64" y="506" width="254" height="124" rx="14" fill="#0E1524" stroke="#FFFFFF" stroke-opacity="0.09"/>
    <rect x="88" y="528" width="34" height="34" rx="9" fill="#00D2FF" fill-opacity="0.13"/>
    <rect x="98" y="544" width="15" height="11" rx="2.5" fill="none" stroke="#00D2FF" stroke-width="1.7"/>
    <path d="M101 544v-3.5a4.5 4.5 0 0 1 9 0" fill="none" stroke="#00D2FF" stroke-width="1.7" stroke-linecap="round"/>
    <text x="88" y="586" fill="#FFFFFF" font-size="14.5" font-weight="600">Crawler access</text>
    <text x="88" y="606" fill="#64748B" font-size="12.5">robots.txt must allow</text>
    <text x="88" y="622" fill="#64748B" font-size="12.5">GPTBot, ClaudeBot and peers</text>

    <rect x="336" y="506" width="254" height="124" rx="14" fill="#0E1524" stroke="#FFFFFF" stroke-opacity="0.09"/>
    <rect x="360" y="528" width="34" height="34" rx="9" fill="#378ADD" fill-opacity="0.15"/>
    <path d="M369 539h16M369 545h16M369 551h10" stroke="#378ADD" stroke-width="1.7" stroke-linecap="round"/>
    <text x="360" y="586" fill="#FFFFFF" font-size="14.5" font-weight="600">Structured data</text>
    <text x="360" y="606" fill="#64748B" font-size="12.5">FAQPage and Article markup</text>
    <text x="360" y="622" fill="#64748B" font-size="12.5">describing visible content</text>

    <rect x="608" y="506" width="254" height="124" rx="14" fill="#0E1524" stroke="#FFFFFF" stroke-opacity="0.09"/>
    <rect x="632" y="528" width="34" height="34" rx="9" fill="#7B61FF" fill-opacity="0.15"/>
    <path d="M641 538l-5 7 5 7M657 538l5 7-5 7" stroke="#7B61FF" stroke-width="1.7" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="632" y="586" fill="#FFFFFF" font-size="14.5" font-weight="600">HTML, not JavaScript</text>
    <text x="632" y="606" fill="#64748B" font-size="12.5">Most AI crawlers never run</text>
    <text x="632" y="622" fill="#64748B" font-size="12.5">scripts — prerender the page</text>

    <rect x="880" y="506" width="256" height="124" rx="14" fill="#0E1524" stroke="#FFFFFF" stroke-opacity="0.09"/>
    <rect x="904" y="528" width="34" height="34" rx="9" fill="#00D2FF" fill-opacity="0.13"/>
    <circle cx="921" cy="545" r="9" fill="none" stroke="#00D2FF" stroke-width="1.7"/>
    <path d="M921 540v5.5l3.5 2.5" stroke="#00D2FF" stroke-width="1.7" fill="none" stroke-linecap="round"/>
    <text x="904" y="586" fill="#FFFFFF" font-size="14.5" font-weight="600">Date and author</text>
    <text x="904" y="606" fill="#64748B" font-size="12.5">Models favour sources that</text>
    <text x="904" y="622" fill="#64748B" font-size="12.5">say when and who</text>
  </g>

  <text x="64" y="672" fill="#64748B" font-size="13">aivonixflow.com · Where AI meets automation</text>
  <rect x="64" y="684" width="120" height="3" rx="1.5" fill="url(#accent4)"/>
</svg>
